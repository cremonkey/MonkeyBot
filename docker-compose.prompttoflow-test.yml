# Isolated Prompt-to-Flow test stack (Phase 10.5, brief §24). Own compose project
# mb-prompttoflow-test, own DB volume, web bound to 127.0.0.1:8096 only. NOT the shared
# monkeybot-staging stack, NOT any other mb-*-test stack — a separate stack so this branch's
# tests never collide with concurrent work on other branches/worktrees.
#  - run with: docker compose -p mb-prompttoflow-test -f docker-compose.prompttoflow-test.yml up -d
#  - own DB volume with a FRESH schema (initial_db.sql + migrations), never production data
#  - no Traefik labels, not on dokploy-network; web bound to 127.0.0.1:8096 only
#  - reuses the production image tag so it tests the same PHP runtime
# Credentials come from .env.staging (gitignored, generated on the host, chmod 600).
services:
  app:
    image: monkeybot-app-ojzrhf-app:latest
    env_file: [.env.staging]
    networks:
      default:
        aliases: [monkeybot-php-app]
    volumes:
      - ./:/var/www/html:rw
    depends_on:
      db:
        condition: service_healthy
  web:
    image: nginx:1.27-alpine
    depends_on: [app]
    ports: ["127.0.0.1:8096:80"]
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
  db:
    image: mariadb:10.11
    env_file: [.env.staging]
    command: ["--character-set-server=utf8", "--collation-server=utf8_general_ci", "--sql-mode=", "--innodb-file-per-table=1"]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      retries: 30
    volumes:
      - prompttoflow_test_db:/var/lib/mysql
volumes:
  prompttoflow_test_db:
