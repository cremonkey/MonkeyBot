# Production compose for the Dokploy-managed deployment on server.cremonkey.com.
#
# Kept separate from docker-compose.yml so the plain dev compose stays portable.
# Two differences, both specific to this server:
#
#   1. Volumes are declared external and pinned to the pre-Dokploy names
#      (monkeybot_*). Without this, Dokploy's own project name would prefix
#      fresh empty volumes and the site would come up with no database and no
#      uploads.
#   2. Every service has an explicit restart policy. The dev compose leaves
#      `db` on Docker's default of "no", so a host reboot would have started
#      the site without its database.
#
# Secrets live in /root/monkeybot/.env and are read via env_file, so they are
# never copied into Dokploy's database. That file must stay in place.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    env_file:
      - /root/monkeybot/.env
    volumes:
      - ./:/var/www/html:rw
      - app_cache:/var/www/html/application/cache
      - app_logs:/var/www/html/application/logs
      - app_config:/var/www/html/application/config
      - app_upload:/var/www/html/upload
      - app_upload_caster:/var/www/html/upload_caster
      - app_download:/var/www/html/download
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "9000"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    expose:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.monkeybot-web.entrypoints=web
      - traefik.http.routers.monkeybot-web.middlewares=redirect-to-https@file
      - traefik.http.routers.monkeybot-web.rule=Host(`bot.cremonkey.com`)
      - traefik.http.routers.monkeybot-web.service=monkeybot-web
      - traefik.http.routers.monkeybot-websecure.entrypoints=websecure
      - traefik.http.routers.monkeybot-websecure.rule=Host(`bot.cremonkey.com`)
      - traefik.http.routers.monkeybot-websecure.service=monkeybot-websecure
      - traefik.http.routers.monkeybot-websecure.tls.certresolver=letsencrypt
      - traefik.http.services.monkeybot-web.loadbalancer.server.port=80
      - traefik.http.services.monkeybot-websecure.loadbalancer.server.port=80
    networks:
      - default
      - dokploy-network
    volumes:
      - ./:/var/www/html:ro
      - app_cache:/var/www/html/application/cache:ro
      - app_logs:/var/www/html/application/logs:ro
      - app_config:/var/www/html/application/config:ro
      - app_upload:/var/www/html/upload:ro
      - app_upload_caster:/var/www/html/upload_caster:ro
      - app_download:/var/www/html/download:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    command: ["nginx", "-g", "daemon off;"]

  db:
    image: mariadb:10.11
    restart: unless-stopped
    command:
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
      - --sql-mode=
      - --innodb-file-per-table=1
    env_file:
      - /root/monkeybot/.env
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  dokploy-network:
    external: true

volumes:
  db_data:
    external: true
    name: monkeybot_db_data
  app_cache:
    external: true
    name: monkeybot_app_cache
  app_logs:
    external: true
    name: monkeybot_app_logs
  app_config:
    external: true
    name: monkeybot_app_config
  app_upload:
    external: true
    name: monkeybot_app_upload
  app_upload_caster:
    external: true
    name: monkeybot_app_upload_caster
  app_download:
    external: true
    name: monkeybot_app_download
