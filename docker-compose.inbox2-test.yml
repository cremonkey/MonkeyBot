# Unified Inbox follow-up (labels, canned-by-channel, attachments, AI suggested reply) isolated
# TEST stack. Never the shared staging stack (monkeybot-staging), never production.
# Copy of docker-compose.pricing2-test.yml with its own project/port/volume, plus a fake
# OpenWA gateway so an image reply can be proven end to end without any real provider:
#  - run with: docker compose -p mb-inbox2-test -f docker-compose.inbox2-test.yml up -d
#  - own DB volume with a FRESH schema (initial_db.sql + migrations), never production data
#  - no Traefik labels, not on dokploy-network; web bound to 127.0.0.1:8102 only
#  - fakegw (tests/inbox/fake_gateway.php) is reachable only inside this project's network
#  - reuses the production image tag so the test runs the same PHP runtime
# Credentials come from .env.staging (gitignored, chmod 600), generated on the host.
# Tear down with: docker compose -p mb-inbox2-test -f docker-compose.inbox2-test.yml down -v
services:
  app:
    image: monkeybot-app-ojzrhf-app:latest
    env_file: [.env.staging]
    networks:
      default:
        aliases: [monkeybot-php-app]
    volumes:
      - ./:/var/www/html:rw
    depends_on:
      db:
        condition: service_healthy
  web:
    image: nginx:1.27-alpine
    depends_on: [app]
    ports: ["127.0.0.1:8102:80"]
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
  fakegw:
    image: monkeybot-app-ojzrhf-app:latest
    entrypoint: ["php", "-S", "0.0.0.0:8080", "/srv/fake_gateway.php"]
    volumes:
      - ./tests/inbox/fake_gateway.php:/srv/fake_gateway.php:ro
  db:
    image: mariadb:10.11
    env_file: [.env.staging]
    command: ["--character-set-server=utf8", "--collation-server=utf8_general_ci", "--sql-mode=", "--innodb-file-per-table=1"]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      retries: 30
    volumes:
      - inbox2_test_db:/var/lib/mysql
volumes:
  inbox2_test_db:
