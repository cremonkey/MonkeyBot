# TLS front for tests/inbound_media/fake_provider.php, answering as graph.facebook.com and
# api.telegram.org inside the isolated media test network only (docker-compose.media-test.yml).
server {
    listen 443 ssl;
    server_name graph.facebook.com api.telegram.org;
    ssl_certificate     /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    location / {
        proxy_pass http://fakeprov:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
