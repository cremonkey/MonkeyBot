resolver 127.0.0.11 ipv6=off valid=30s;

upstream php_backend {
    zone php_backend 64k;
    server monkeybot-php-app:9000 resolve;
}

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 256m;
    fastcgi_read_timeout 600;
    send_timeout 600;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    location ~* ^/(?:application|system|ci|docker)(?:/|$) {
        deny all;
    }

    location ~* ^/assets/backup_db(?:/|$) {
        deny all;
    }

    # The web root is the repo root, so repo-only material must be denied explicitly:
    # composer vendor tree (incl. a 32 MB vendor.zip), internal docs (sales prompts,
    # client pricing JSON, security reports), build/setup files, backups and scripts.
    # documentation/ is the in-app user help and stays public.
    location ~* ^/(?:vendor|docs)(?:/|$) {
        deny all;
    }

    location ~* ^/(?:composer\.(?:json|lock)|docker-compose[^/]*\.ya?ml|[^/]+\.md)$ {
        deny all;
    }

    location ~* \.(?:sql|py|sh|bak)$ {
        deny all;
    }

    location ~* \.bak-[^/]*$ {
        deny all;
    }

    location ~* ^/(?:upload|upload_caster|download)/.*\.php$ {
        deny all;
    }

    location ~* /\.(?!well-known).* {
        deny all;
    }

    # TikTok URL-prefix verification: the portal requires the signature file
    # under the virtual tiktok_bot/callback/ CI route; serve it from web root
    location ~ ^/tiktok_bot/callback/(tiktok[A-Za-z0-9]+\.txt)$ {
        try_files /$1 =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass php_backend;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|webp|ttf|woff|woff2|map)$ {
        expires 30d;
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }
}
